aid: medefer
name: Medefer
description: >-
  Medefer is a UK digital-first managed clinical services company that connects
  patients directly with consultant specialists remotely and safely, working in
  partnership with the NHS. Its virtual, consultant-led model triages and manages
  patient referrals through remote review, coordinating in-person tests and
  treatment through a trusted local and national partner network only when they
  are needed. Backed by Seedcamp, Medefer brings hospital-level specialist
  expertise into patients' homes and communities, reducing waiting times for NHS
  and self-pay patients across a range of specialties. Medefer operates a
  patient/clinician application and a private internal application backend
  (api.medefer.com) rather than a public developer API program.
